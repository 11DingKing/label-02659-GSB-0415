services:
  scibert-ner:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scibert-ner-service
    ports:
      - "8000:8000"
    environment:
      - NUM_THREADS=4
      - BATCH_SIZE=16
      - MAX_LENGTH=512
      - MODEL_NAME=allenai/scibert_scivocab_cased
    volumes:
      - model_cache:/root/.cache/huggingface
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 30s
      start_period: 120s
      retries: 3

volumes:
  model_cache:
    driver: local
